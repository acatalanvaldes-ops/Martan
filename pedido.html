<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu pedido · Martan</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#12263A">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/estilos.css">
  <script src="/assets/tienda.js" defer></script>
  <script src="/assets/pedido.js" defer></script>
</head>
<body data-sin-carro>
  <header class="cabecera">
    <div class="contenedor cabecera__fila">
      <a class="marca" href="/">
        <img class="marca__iso" src="/assets/isotipo.svg" alt="" width="42" height="42">
        <span class="marca__txt"><b>MARTAN</b><small>CONGELADOS</small></span>
      </a>
    </div>
  </header>

  <main class="contenedor" style="max-width:720px;padding:32px 0 64px">
    <section class="panel estado estado--info" data-estado>
      <div class="estado__icono"><svg class="girando" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg></div>
      <h1>Cargando tu pedido…</h1>
    </section>
    <section class="panel oculto" data-detalle></section>
  </main>
</body>
</html>
